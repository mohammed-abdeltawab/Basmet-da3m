<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الأعضاء | مبادرة بصمة دعم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-blue: #025cc2; /* الأزرق الملكي من الصورة */
            --accent-gold: #f4b644;  /* لون زر الدخول الأصفر */
            --bg-light: #f4f7fa;
            --white: #ffffff;
            --text-dark: #333;
            --text-muted: #777;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            background-image: radial-gradient(circle at top left, rgba(2, 92, 194, 0.08) 0%, transparent 50%),
                              radial-gradient(circle at bottom right, rgba(2, 92, 194, 0.05) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .card-header {
            background: var(--primary-blue);
            color: var(--white);
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .card-body {
            padding: 30px 25px;
        }

        .instructions {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 1px solid #dcdfe6;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
            background: #fcfdfd;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-blue);
            background: var(--white);
        }

        .input-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-blue);
            font-size: 16px;
            right: 15px;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent-gold);
            color: var(--text-dark);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(244, 182, 68, 0.2);
        }

        .btn-submit:hover {
            background: #e0a334;
            transform: translateY(-1px);
        }

        .divider {
            height: 1px;
            background: #ebeef5;
            margin: 25px 0 15px;
        }

        .back-link {
            text-align: center;
        }

        .back-link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .alert-error {
            background: #fef0f0;
            color: #f56c6c;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            border: 1px solid #fde2e2;
        }
    </style>
<link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

    <div class="login-card">
        <div class="card-header">
            <i class="fas fa-user-circle"></i>
            <span>تسجيل الدخول</span>
        </div>
        
        <div class="card-body">
            <p class="instructions">أدخل الرقم القومي الخاص بك لاستعراض ملفك الشخصي</p>
            
            <div id="loginError" class="alert-error"></div>

            <form id="memberLoginForm">
                <!-- حقل الرقم القومي فقط -->
                <div class="form-group">
                    <label>الالرقم القومي</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card input-icon"></i>
                        <input type="text" id="loginNationalId" placeholder="أدخل الـ 14 رقم كاملين" required maxlength="14">
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <span>تسجيل الدخول</span>
                    <i class="fas fa-sign-in-alt"></i>
                </button>
            </form>

            <div class="divider"></div>

            <div class="back-link">
                <a href="join.html"><i class="fas fa-arrow-right"></i> ليس لديك حساب؟ انضم إلينا وسجل الآن</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="member-login.js"></script>
</body>
</html>
